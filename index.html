
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050810">
<title>Mobile Quest 0.2</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #03060c;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#vr {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3,7,15,.94);
    padding: 20px;
}

.card {
    width: min(100%, 390px);
    padding: 25px;
    border: 1px solid #17445b;
    border-radius: 16px;
    background: #0b1420;
    box-shadow: 0 0 35px #007da522;
}

h1 {
    color: #5cddff;
    letter-spacing: 3px;
    font-size: 23px;
}

p {
    color: #a5b5c5;
    font-size: 13px;
    line-height: 1.6;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 1px solid #24617a;
    border-radius: 8px;
    background: #102b40;
    color: white;
    font-weight: bold;
}

button:active {
    background: #176080;
}

#status {
    margin-top: 16px;
    color: #5cddff;
    font-size: 12px;
}

#hud {
    position: fixed;
    z-index: 3;
    top: 12px;
    left: 12px;
    font-size: 10px;
    color: #69e5ff;
    pointer-events: none;
}

#reticulo {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    border: 1px solid white;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    z-index: 2;
    pointer-events: none;
}

.oculto { display: none !important; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<canvas id="vr"></canvas>

<div id="reticulo" class="oculto"></div>

<div id="hud" class="oculto">
    MOBILE QUEST 0.2 | FUTURE ROOM
</div>

<div id="menu">
    <div class="card">
        <h1>MOBILE QUEST</h1>
        <p>Ambiente virtual experimental.</p>
        <p>Prepare seu VR Box e coloque o celular na posição horizontal.</p>

        <button id="sensor">ATIVAR HEAD TRACKING</button>
        <button id="entrar">ENTRAR NA SALA VIRTUAL</button>

        <div id="status">Sistema aguardando.</div>
    </div>
</div>

<script type="module">

import * as THREE from "three";

// =================================
// CONFIGURAÇÕES
// =================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030710);
scene.fog = new THREE.Fog(0x030710, 12, 32);

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("vr"),
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const cameraCentral = new THREE.PerspectiveCamera(
    75, 1, 0.1, 100
);

cameraCentral.position.set(0, 1.65, 0);

// Câmeras dos olhos

const cameraLeft = cameraCentral.clone();
const cameraRight = cameraCentral.clone();

const IPD = 0.064;

const olhoEsquerdo = new THREE.Vector3(-IPD / 2, 0, 0);
const olhoDireito = new THREE.Vector3(IPD / 2, 0, 0);

// =================================
// ILUMINAÇÃO
// =================================

scene.add(new THREE.AmbientLight(0x7899bb, 1.2));

const luzPrincipal = new THREE.PointLight(
    0x18bfff, 18, 18
);
luzPrincipal.position.set(0, 2.7, -3);
scene.add(luzPrincipal);

const luzSecundaria = new THREE.PointLight(
    0x0066ff, 12, 15
);
luzSecundaria.position.set(-3, 2, 1);
scene.add(luzSecundaria);

// =================================
// MATERIAIS
// =================================

const parede = new THREE.MeshStandardMaterial({
    color: 0x101b2a,
    metalness: 0.8,
    roughness: 0.35
});

const pisoMaterial = new THREE.MeshStandardMaterial({
    color: 0x090f19,
    metalness: 0.85,
    roughness: 0.25
});

const neon = new THREE.MeshStandardMaterial({
    color: 0x00bfff,
    emissive: 0x0088ff,
    emissiveIntensity: 2
});

// =================================
// CONSTRUÇÃO DA SALA
// =================================

function bloco(w, h, d, material, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, y, z);
    scene.add(mesh);

    return mesh;
}

// Piso

bloco(10, 0.2, 12, pisoMaterial, 0, -0.1, -2);

// Teto

bloco(10, 0.2, 12, parede, 0, 3.5, -2);

// Paredes laterais

bloco(0.2, 3.5, 12, parede, -5, 1.65, -2);
bloco(0.2, 3.5, 12, parede, 5, 1.65, -2);

// Parede de fundo

bloco(10, 3.5, 0.2, parede, 0, 1.65, -8);

// Moldura luminosa

bloco(0.05, 3.1, 0.05, neon, -4.7, 1.7, -7.8);
bloco(0.05, 3.1, 0.05, neon, 4.7, 1.7, -7.8);
bloco(9.4, 0.05, 0.05, neon, 0, 3.15, -7.8);

// Linhas do piso

for (let i = -4; i <= 4; i += 2) {
    bloco(0.025, 0.025, 10, neon, i, 0.015, -2);
}

// =================================
// PAINEL CENTRAL
// =================================

// Criar painel usando textura

function criarPainel() {
    const canvas = document.createElement("canvas");
    canvas.width = 1024;
    canvas.height = 512;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#071522";
    ctx.fillRect(0, 0, 1024, 512);

    ctx.strokeStyle = "#00cfff";
    ctx.lineWidth = 8;
    ctx.strokeRect(10, 10, 1004, 492);

    ctx.fillStyle = "#6de8ff";
    ctx.font = "bold 55px Arial";
    ctx.fillText("MOBILE QUEST", 65, 115);

    ctx.fillStyle = "#ffffff";
    ctx.font = "28px Arial";
    ctx.fillText("CENTRAL DE COMANDO", 65, 180);

    ctx.fillStyle = "#83a9c0";
    ctx.font = "22px Arial";
    ctx.fillText("AMBIENTE VIRTUAL ONLINE", 65, 260);

    ctx.fillStyle = "#00cfff";
    ctx.fillRect(65, 300, 890, 3);

    ctx.fillStyle = "#ffffff";
    ctx.font = "22px Arial";
    ctx.fillText("SELECIONE UMA EXPERIENCIA", 65, 365);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
    });

    const tela = new THREE.Mesh(
        new THREE.PlaneGeometry(4.5, 2.25),
        material
    );

    tela.position.set(0, 2.15, -7.65);
    scene.add(tela);
}

criarPainel();

// =================================
// BOTÕES 3D
// =================================

const interativos = [];

function criarBotao(texto, x, acao) {
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 160;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#102c40";
    ctx.fillRect(0, 0, 512, 160);

    ctx.strokeStyle = "#00cfff";
    ctx.lineWidth = 6;
    ctx.strokeRect(4, 4, 504, 152);

    ctx.fillStyle = "white";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.fillText(texto, 256, 95);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true
    });

    const botao = new THREE.Mesh(
        new THREE.PlaneGeometry(1.5, 0.48),
        material
    );

    botao.position.set(x, 1.25, -6.5);

    botao.userData.acao = acao;

    scene.add(botao);
    interativos.push(botao);

    return botao;
}

criarBotao("EXPLORAR", -1.65, () => {
    mostrarMensagem("Exploração selecionada");
});

criarBotao("CINEMA", 0, () => {
    mostrarMensagem("Modo cinema selecionado");
});

criarBotao("CONFIG", 1.65, () => {
    mostrarMensagem("Configurações selecionadas");
});

// =================================
// ELEMENTOS DECORATIVOS
// =================================

for (let i = 0; i < 8; i++) {
    const esfera = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 12, 12),
        neon
    );

    esfera.position.set(
        -4.5 + i * 1.3,
        2.9,
        -7.7
    );

    scene.add(esfera);
}

// =================================
// HEAD TRACKING
// =================================

let sensorAtivo = false;
let alpha = 0;
let beta = 0;
let gamma = 0;

const euler = new THREE.Euler(0, 0, 0, "YXZ");
const quaternionTela = new THREE.Quaternion();
const quaternionCamera = new THREE.Quaternion();

const eixoZ = new THREE.Vector3(0, 0, 1);
const eixoX = new THREE.Vector3(1, 0, 0);

function orientacao(evento) {
    if (
        evento.alpha === null ||
        evento.beta === null ||
        evento.gamma === null
    ) return;

    alpha = THREE.MathUtils.degToRad(evento.alpha);
    beta = THREE.MathUtils.degToRad(evento.beta);
    gamma = THREE.MathUtils.degToRad(evento.gamma);

    euler.set(beta, alpha, -gamma, "YXZ");

    quaternionCamera.setFromEuler(euler);

    const anguloTela = THREE.MathUtils.degToRad(
        screen.orientation?.angle || 0
    );

    quaternionTela.setFromAxisAngle(eixoZ, -anguloTela);

    quaternionCamera.multiply(quaternionTela);

    quaternionCamera.multiply(
        new THREE.Quaternion().setFromAxisAngle(
            eixoX, -Math.PI / 2
        )
    );

    cameraCentral.quaternion.copy(quaternionCamera);
}

async function ativarSensor() {
    try {
        if (typeof DeviceOrientationEvent === "undefined") {
            throw new Error("Sensor não disponível.");
        }

        if (
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
            const permissao =
                await DeviceOrientationEvent.requestPermission();

            if (permissao !== "granted") {
                throw new Error("Permissão negada.");
            }
        }

        window.addEventListener(
            "deviceorientation",
            orientacao,
            true
        );

        sensorAtivo = true;
        mostrarMensagem("Head Tracking ativado!");

    } catch (erro) {
        mostrarMensagem(erro.message);
    }
}

// =================================
// INTERAÇÃO COM OLHAR
// =================================

const raycaster = new THREE.Raycaster();
const centro = new THREE.Vector2(0, 0);

let alvoAtual = null;

function verificarOlhar() {
    raycaster.setFromCamera(centro, cameraCentral);

    const encontrados = raycaster.intersectObjects(interativos);

    alvoAtual = encontrados.length
        ? encontrados[0].object
        : null;
}

function selecionar() {
    if (alvoAtual?.userData.acao) {
        alvoAtual.userData.acao();
    }
}

window.addEventListener("click", selecionar);

window.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
        selecionar();
    }

    if (e.key === "Escape") {
        document.getElementById("menu")
            .classList.remove("oculto");
    }
});

// =================================
// CONTROLE BLUETOOTH
// =================================

let gamepadDebounce = false;

function verificarControle() {
    const controles = navigator.getGamepads?.() || [];

    for (const controle of controles) {
        if (!controle) continue;

        if (controle.buttons[0]?.pressed) {
            if (!gamepadDebounce) {
                selecionar();
                gamepadDebounce = true;
            }
        } else {
            gamepadDebounce = false;
        }
    }
}

window.addEventListener("gamepadconnected", () => {
    mostrarMensagem("Controle conectado!");
});

// =================================
// MENSAGENS
// =================================

let mensagemAnterior = null;

function mostrarMensagem(texto) {
    const status = document.getElementById("status");
    if (status) {
        status.textContent = texto;
    }

    mensagemAnterior = texto;
}

// =================================
// ENTRADA NA EXPERIÊNCIA
// =================================

document.getElementById("sensor").onclick = ativarSensor;

document.getElementById("entrar").onclick = async () => {
    document.getElementById("menu")
        .classList.add("oculto");

    document.getElementById("hud")
        .classList.remove("oculto");

    document.getElementById("reticulo")
        .classList.remove("oculto");

    if (screen.orientation?.lock) {
        screen.orientation.lock("landscape").catch(() => {});
    }

    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        }
    } catch (e) {
        console.log("Tela cheia indisponível", e);
    }
};

// =================================
// RENDERIZAÇÃO ESTEREOSCÓPICA
// =================================

function animar() {
    requestAnimationFrame(animar);

    const largura = window.innerWidth;
    const altura = window.innerHeight;
    const metade = Math.floor(largura / 2);

    cameraLeft.aspect = metade / altura;
    cameraRight.aspect = metade / altura;

    cameraLeft.updateProjectionMatrix();
    cameraRight.updateProjectionMatrix();

    cameraLeft.position.copy(cameraCentral.position)
        .add(olhoEsquerdo);

    cameraRight.position.copy(cameraCentral.position)
        .add(olhoDireito);

    cameraLeft.quaternion.copy(cameraCentral.quaternion);
    cameraRight.quaternion.copy(cameraCentral.quaternion);

    // Leve animação ambiental
    luzPrincipal.intensity = 16 + Math.sin(
        performance.now() * 0.001
    ) * 2;

    verificarOlhar();
    verificarControle();

    renderer.setScissorTest(true);

    // OLHO ESQUERDO

    renderer.setViewport(0, 0, metade, altura);
    renderer.setScissor(0, 0, metade, altura);
    renderer.render(scene, cameraLeft);

    // OLHO DIREITO

    renderer.setViewport(metade, 0, largura - metade, altura);
    renderer.setScissor(metade, 0, largura - metade, altura);
    renderer.render(scene, cameraRight);

    renderer.setScissorTest(false);
}

window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animar();

</script>

</body>
</html>
